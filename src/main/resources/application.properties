# Conexao com a base de dados (Lendo das Variaveis de Ambiente)
# A variavel DB_URL no painel deve conter toda a string JDBC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dica: Em producao, pode ser interessante mudar para 'false' para nao sujar os logs
spring.jpa.properties.hibernate.format_sql=true

# JWT Properties
jwt.secret=${JWT_SECRET}
# O tempo de expiracao nao estava nas envs, entao mantive fixo (ou crie uma env JWT_EXPIRATION)
jwt.expiration=86400000

# Configurações do Servidor
# O Render injeta a porta automaticamente na variavel PORT
server.port=${PORT:8080}
server.servlet.context-path=/eventHub